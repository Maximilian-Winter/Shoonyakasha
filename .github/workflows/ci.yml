name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows / MSVC / Release
    runs-on: windows-latest

    env:
      VULKAN_SDK_VERSION: 1.3.290.0

    steps:
      - uses: actions/checkout@v4

      # find_package(Vulkan) resolves through vcpkg's `vulkan` port, which is a
      # stub that requires a real SDK on disk. Installed from LunarG directly
      # rather than via a third-party action so the provenance is visible here.
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/VulkanSDK-$env:VULKAN_SDK_VERSION-Installer.exe"
          Invoke-WebRequest -Uri $url -OutFile vulkan-installer.exe
          Start-Process -FilePath .\vulkan-installer.exe `
            -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" `
            -Wait -NoNewWindow
          $sdk = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          "VULKAN_SDK=$sdk"      | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$sdk\Bin"             | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # vcpkg resolves against the builtin-baseline pinned in vcpkg.json, so the
      # cache key only needs the manifest itself.
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      # Default generator (Visual Studio 2022) on purpose: it locates the MSVC
      # toolchain itself, where Ninja would need vcvars sourced into the step.
      - name: Configure
        shell: pwsh
        run: |
          cmake -B build -S . `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_MANIFEST_FEATURES=tests `
            -DBUILD_TESTS=ON `
            -DBUILD_EXAMPLES=OFF `
            -DBUILD_PYTHON=OFF `
            -DSHOONYAKASHA_WERROR=ON

      - name: Build
        run: cmake --build build --config Release

      # The suite is entirely headless — it never creates a VkInstance — so it
      # runs on a GPU-less runner.
      - name: Test
        working-directory: build
        run: ctest --output-on-failure --build-config Release

      # The Python utility modules are pure Python and do not need the compiled
      # extension, so they run here even though BUILD_PYTHON is OFF. Two of these
      # tests parse the C++ sources and fail when the vocabulary they restate
      # drifts — which is the only reason restating it is acceptable.
      #
      # Shader-compilation tests skip themselves when glslc is absent; the
      # runner has the Vulkan SDK installed above, so they run.
      - name: Test Python utilities
        run: python -m unittest discover -s tests/python -v
