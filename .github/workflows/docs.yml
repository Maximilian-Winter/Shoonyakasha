name: Documentation

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes doxygen
          doxygen --version
          python -m pip install -r requirements-docs.txt
      - name: Check repository documentation
        run: |
          python tools/check_docs.py
          python tools/generate_api_docs.py --check
          python -m unittest discover -s tests/python -p 'test_docs*.py' -v
      - name: Build site (warnings are errors)
        run: |
          python -m mkdocs build --strict
          python tools/check_docs_site.py
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
